application:
  subdomain: grocy
  multi_instance: false
  # Grocy ships a hard-coded admin/admin default account and offers no
  # environment variable to override it, so this package deliberately does NOT
  # use public_path: the platform entry keeps a first authentication layer in
  # front of it. Change the password right after the first login.
  upstreams:
    - location: /
      backend: http://grocy:80/
services:
  grocy:
    # upstream: linuxserver/grocy:4.7.1
    image: docker.1ms.run/linuxserver/grocy:4.7.1
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Shanghai
    binds:
      - /lzcapp/var/config:/config
usage: |
  Grocy 是一个自托管的家务与杂货管理系统：库存、购物清单、菜谱、家务任务、电池追踪、
  设备记录等都在里面。首次打开即可使用，数据全部保存在本地。

  首次使用（重要）：
    - 默认账号固定为 admin / admin，**登录后请立刻到设置里修改密码**。
    - 该默认账号写在镜像里，没有环境变量可以覆盖，所以本应用没有开放
      对外直连入口（未使用 public_path），而是经平台入口访问；即便如此，
      也请第一时间改掉默认口令。

  说明：
    - 数据保存在 /config 目录，随应用持久化。
    - 本应用不需要 privileged 模式，也不访问宿主机设备。
    - 未做实机验证。
